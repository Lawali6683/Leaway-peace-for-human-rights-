<!DOCTYPE html>
<html lang="en">
<head>

<title>Contact | LPFHRA</title>

<body>
<header id="h"></header>
<main>
<section class="pg">
<h2>Contact us</h2>
<p class="sub">Send us a message, or visit one of our offices.</p>
<form id="cf">
<input name="n" placeholder="Your name" autocomplete="name" required>
<input name="t" placeholder="Your phone number or email" required>
<textarea name="m" rows="5" placeholder="Your message" required></textarea>
<button type="submit">Send message</button>
</form>
<h2>Our offices</h2>
<ul class="of" id="of"></ul>
</section>
</main>
<script src="index.js"></script>
</body>
